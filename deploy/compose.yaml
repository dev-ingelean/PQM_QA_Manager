services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pqm
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
      - app_password
    ports:
      - "5433:5432"
    volumes:
      - pqm_pgdata:/var/lib/postgresql/data
      - ./init-app.sh:/docker-entrypoint-initdb.d/10-init-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pqm"]
      interval: 10s
      timeout: 5s
      retries: 5
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_password:
    file: ./secrets/app_password.txt
volumes:
  pqm_pgdata:
